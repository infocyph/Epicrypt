name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/release.yml@main
    permissions:
      contents: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  phpforge:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    with:
      fail_on_skipped_tests: true
      integration_services: '[]'
      service_topologies: '{}'
      php_extensions: "hash, json, openssl, sodium"
    permissions:
      security-events: write
      actions: read
      contents: read

  release-candidate-acceptance:
    if: github.event_name == 'pull_request'
    name: "PHPForge release candidate acceptance"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Lint and test matched-host performance comparator
        run: |
          bash -n benchmarks/host-rpm-compare.sh
          bash -n benchmarks/docker-host-acceptance.sh
          bash -n tests/Smoke/host-rpm-comparator-test.sh
          bash tests/Smoke/host-rpm-comparator-test.sh
      - name: Validate real wrk Lua response accounting
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wrk
          root=$(mktemp -d)
          printf '%s\n' '<?php echo "release-health-ok";' > "$root/index.php"
          php -S 127.0.0.1:19019 -t "$root" > "$root/php-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || :; rm -rf "$root"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:19019/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:19019/ | grep -Fxq 'release-health-ok'
          HOST_EXPECTED_BODY=release-health-ok wrk -t1 -c2 -d2s \
            -s benchmarks/host-rpm-validate.lua http://127.0.0.1:19019/ \
            | tee "$root/accepted.log"
          awk '/^EPICRYPT_WRK / { if ($2 > 0 && $3 == 0 && $2 == $4) accepted=1 } END {exit !accepted}' "$root/accepted.log"
          HOST_EXPECTED_BODY=incorrect wrk -t1 -c2 -d2s \
            -s benchmarks/host-rpm-validate.lua http://127.0.0.1:19019/ \
            | tee "$root/rejected.log"
          awk '/^EPICRYPT_WRK / { if ($2 == 0 && $3 > 0 && $3 == $4) rejected=1 } END {exit !rejected}' "$root/rejected.log"
      - name: Verify tag-only release routing without creating a tag
        run: |
          grep -Fq '    tags: [ "*" ]' .github/workflows/security-standards.yml
          grep -Fq "if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')" .github/workflows/security-standards.yml
          grep -Fq 'uses: infocyph/phpforge/.github/workflows/release.yml@main' .github/workflows/security-standards.yml
      - name: Install development and QA dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Apply PHPForge processors without changing committed sources
        run: |
          composer ic:process
          git diff --exit-code
      - name: Run detailed PHPForge quality suite
        run: composer ic:tests:details
      - name: Run final PHPForge release guard
        run: composer ic:release:guard

  docker-host-acceptance:
    if: github.event_name == 'pull_request'
    name: "Matched Alpine FPM RPM and persistent-host acceptance"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
      - name: Install fixture dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Isolate benchmark controllers from FPM CPUs
        shell: bash
        run: |
          mkdir -p var/docker-host-acceptance
          for daemon in dockerd containerd; do
            pids=$(pgrep -x "$daemon")
            for daemon_pid in $pids; do
              sudo taskset -apc 0,1 "$daemon_pid"
            done
          done > var/docker-host-acceptance/controller-affinity.txt
      - name: Measure matched deployments and sustained lifecycle
        env:
          HOST_SOAK_CPUS: "2"
          HOST_DURATION: "60s"
        run: taskset -c 0,1 bash benchmarks/docker-host-acceptance.sh
      - name: Preserve raw measurements and deployment configuration
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-host-acceptance
          path: var/docker-host-acceptance/
          if-no-files-found: error

  production-minimal:
    if: github.event_name == 'pull_request'
    name: "Production-only declared extensions (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install only production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - name: Verify absent optional integrations and minimal production paths
        run: php tests/Smoke/core-no-pathwise.php
      - name: Verify minimum declared extension set without php.ini
        shell: bash
        run: |
          flags=()
          for extension in hash json openssl sodium; do
            if ! php -n -r "exit(extension_loaded('$extension') ? 0 : 1);"; then
              flags+=("-d" "extension=$extension")
            fi
          done
          php -n "${flags[@]}" -r 'foreach (["hash", "json", "openssl", "sodium"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing required extension: $extension\n"); exit(1); } }'
          php -n "${flags[@]}" tests/Smoke/core-no-pathwise.php

  persistent-runwire-host:
    if: github.event_name == 'pull_request'
    name: "Borrowed Runwire long-lived host (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install integration requirements
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Test reused host and worker replacement
        run: |
          php tests/Smoke/persistent-runwire-host.php > "${{ runner.temp }}/host-first.json"
          php tests/Smoke/persistent-runwire-host.php > "${{ runner.temp }}/host-replacement.json"
          php -r '$a=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); $b=json_decode(file_get_contents($argv[2]),true,512,JSON_THROW_ON_ERROR); if($a["pid"]===$b["pid"] || $a["verified"]!==2100 || $b["verified"]!==2100) { throw new RuntimeException("Worker replacement/roundtrip evidence failed."); }' "${{ runner.temp }}/host-first.json" "${{ runner.temp }}/host-replacement.json"
          cat "${{ runner.temp }}/host-first.json"
          cat "${{ runner.temp }}/host-replacement.json"

  jose-interoperability:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Independent JOSE interoperability"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install and audit the independent JOSE implementation
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Verify bidirectional JOSE interoperability
        run: |
          php tests/Interop/epicrypt.php produce "${{ runner.temp }}/epicrypt-jose.json"
          node tests/Interop/jose.mjs "${{ runner.temp }}/epicrypt-jose.json" "${{ runner.temp }}/independent-jose.json"
          php tests/Interop/epicrypt.php consume "${{ runner.temp }}/epicrypt-jose.json" "${{ runner.temp }}/independent-jose.json"

  auth-interoperability:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Independent OAuth OIDC interoperability"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install and audit the independent JOSE implementation
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Verify bidirectional OAuth and OIDC profiles
        run: |
          php tests/Interop/auth-epicrypt.php produce "${{ runner.temp }}/epicrypt-auth.json"
          node tests/Interop/auth-jose.mjs "${{ runner.temp }}/epicrypt-auth.json" "${{ runner.temp }}/independent-auth.json"
          php tests/Interop/auth-epicrypt.php consume "${{ runner.temp }}/epicrypt-auth.json" "${{ runner.temp }}/independent-auth.json"

  auth-performance:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Authentication performance and memory evidence"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Record authentication performance and persistent-worker memory evidence
        run: php benchmarks/authentication.php | tee "${{ runner.temp }}/authentication-evidence.json"
      - name: Validate recorded evidence document
        run: |
          php -r '$e=json_decode(file_get_contents($argv[1]), true, 32, JSON_THROW_ON_ERROR); $required=["access_token_issue_verify","authorization_code_jwe","refresh_token_jwe","dpop_issue_verify","oidc_id_token_issue_verify","pat_store_validation","fallback_key_verification"]; foreach ($required as $name) { if (!isset($e["measurements"][$name]["us_per_operation"])) { fwrite(STDERR, "Missing evidence: $name\n"); exit(1); } } if (($e["persistent_worker_memory"]["growth_bytes"] ?? PHP_INT_MAX) > ($e["persistent_worker_memory"]["max_growth_bytes"] ?? -1)) { exit(1); }' "${{ runner.temp }}/authentication-evidence.json"

  windows-file-publication:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Windows atomic file publication"
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium, fileinfo"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Resolve PHPForge Pest template for Windows
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $config = Get-Content 'vendor/infocyph/phpforge/resources/pest.xml' -Raw
          $config = $config.Replace('vendor/phpunit/phpunit/phpunit.xsd', "$workspace/vendor/phpunit/phpunit/phpunit.xsd")
          $config = $config.Replace('bootstrap="vendor/autoload.php"', "bootstrap=`"$workspace/vendor/autoload.php`"")
          $config = $config.Replace('<directory>./tests</directory>', "<directory>$workspace/tests</directory>")
          $config = $config.Replace('<directory suffix=".php">./src</directory>', "<directory suffix=`".php`">$workspace/src</directory>")
          Set-Content -Path "$env:RUNNER_TEMP/pest-windows.xml" -Value $config -Encoding utf8
      - name: Exercise Windows publication and replacement semantics
        run: php vendor/bin/pest --configuration "$env:RUNNER_TEMP/pest-windows.xml" tests/DataProtection/FilePublicationSafetyTest.php --fail-on-skipped

  aegis-modern-libsodium:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "AEGIS on libsodium 1.0.22"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AEGIS_RUNTIME: "php:8.4-cli-alpine@sha256:26e3f1de7f6aa3e8ea15584d803c5e088c57df89ff02a3ecf2dc855a4282d8d7"
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Require the modern linked runtime
        run: |
          docker pull "$AEGIS_RUNTIME"
          docker run --rm "$AEGIS_RUNTIME" php --ri sodium
          docker run --rm "$AEGIS_RUNTIME" php -r 'printf("PHP=%s libsodium=%s sodium=%s AEGIS-128L=%s AEGIS-256=%s\n", PHP_VERSION, SODIUM_LIBRARY_VERSION, extension_loaded("sodium") ? "loaded" : "missing", function_exists("sodium_crypto_aead_aegis128l_encrypt") ? "yes" : "no", function_exists("sodium_crypto_aead_aegis256_encrypt") ? "yes" : "no");'
          docker run --rm "$AEGIS_RUNTIME" php -r 'exit(version_compare(SODIUM_LIBRARY_VERSION, "1.0.19", ">=") && function_exists("sodium_crypto_aead_aegis128l_encrypt") && function_exists("sodium_crypto_aead_aegis256_encrypt") ? 0 : 1);'
      - name: Run mandatory positive AEGIS tests
        run: >-
          docker run --rm
          --workdir /workspace
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --env EPICRYPT_REQUIRE_AEGIS=1
          "$AEGIS_RUNTIME"
          php vendor/bin/pest
          --configuration vendor/infocyph/phpforge/resources/pest.xml
          --bootstrap /workspace/vendor/autoload.php
          --cache-directory=/tmp/pest-cache
          tests/Certificate/SodiumAdvancedTest.php
          --filter=AEGIS
          --fail-on-skipped

  mutation-security-critical:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Security-critical mutation testing (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: data-protection
            classes: 'Infocyph\Epicrypt\Crypto\AeadCipher,Infocyph\Epicrypt\DataProtection\StringProtector,Infocyph\Epicrypt\DataProtection\EnvelopeProtector,Infocyph\Epicrypt\DataProtection\FileProtector'
          - shard: jwe
            classes: 'Infocyph\Epicrypt\Token\Jwt\Jwe'
          - shard: jws
            classes: 'Infocyph\Epicrypt\Token\Jwt\Jws,Infocyph\Epicrypt\Token\Jwt\Support\JosePolicy,Infocyph\Epicrypt\Token\Jwt\Support\JwtToken'
          - shard: validation-policy
            classes: 'Infocyph\Epicrypt\Password\PasswordHasher,Infocyph\Epicrypt\Token\Jwt\JwtValidator,Infocyph\Epicrypt\Security\AsymmetricSigningKeySet,Infocyph\Epicrypt\Security\KeyRing'
          - shard: jwt-policy
            classes: 'Infocyph\Epicrypt\Token\Jwt\AsymmetricJwt,Infocyph\Epicrypt\Token\Jwt\DpopProof,Infocyph\Epicrypt\Token\Jwt\JwtPolicy,Infocyph\Epicrypt\Token\Jwt\OpenIdIdTokenValidator,Infocyph\Epicrypt\Token\Jwt\SymmetricJwt'
          - shard: signed-helpers
            classes: 'Infocyph\Epicrypt\Generate\KeyMaterial\KeyDeriver,Infocyph\Epicrypt\Generate\KeyMaterial\KeyMaterialGenerator,Infocyph\Epicrypt\Internal\SecurityPolicy,Infocyph\Epicrypt\Internal\SignedPayloadCodec,Infocyph\Epicrypt\Security\SignedUrl,Infocyph\Epicrypt\Security\Support\AbstractPurposeToken,Infocyph\Epicrypt\Token\Payload\PurposeToken'
          - shard: primitive-verification
            classes: 'Infocyph\Epicrypt\Crypto\Mac,Infocyph\Epicrypt\Crypto\SecretStream,Infocyph\Epicrypt\Crypto\Signature,Infocyph\Epicrypt\Internal\EcdsaSignatureConverter'
          - shard: remote-jose
            classes: 'Infocyph\Epicrypt\Token\Jwt\RemoteJwks,Infocyph\Epicrypt\Token\Jwt\RemoteJwksConfiguration,Infocyph\Epicrypt\Token\Jwt\Support\JweKeyManager,Infocyph\Epicrypt\Token\Jwt\Support\NativeRemoteJoseHostResolver,Infocyph\Epicrypt\Token\Jwt\Support\RemoteJoseResource'
          - shard: certificate-pki
            classes: 'Infocyph\Epicrypt\Certificate\CertificateChainVerifier,Infocyph\Epicrypt\Certificate\CertificateInspector,Infocyph\Epicrypt\Certificate\CsrInspector,Infocyph\Epicrypt\Certificate\Pkcs12'
          - shard: oauth-authorization
            classes: 'Infocyph\Epicrypt\Auth\OAuth\AuthorizationCodeArtifact,Infocyph\Epicrypt\Auth\OAuth\OAuthAuthorizationRequestValidator,Infocyph\Epicrypt\Auth\OAuth\OAuthAuthorizationInteraction,Infocyph\Epicrypt\Auth\OAuth\OAuthAuthorizationCodeIssuer,Infocyph\Epicrypt\Auth\OAuth\OAuthAuthorizationCodeConsumer'
          - shard: oauth-token-grants
            classes: 'Infocyph\Epicrypt\Auth\OAuth\OAuthTokenEndpoint,Infocyph\Epicrypt\Auth\OAuth\OAuthAccessTokenService,Infocyph\Epicrypt\Auth\OAuth\OAuthAccessTokenInspector,Infocyph\Epicrypt\Auth\OAuth\OAuthResourceAccessTokenValidator'
          - shard: oauth-refresh-revocation
            classes: 'Infocyph\Epicrypt\Auth\OAuth\RefreshTokenArtifact,Infocyph\Epicrypt\Auth\OAuth\RefreshTokenManager,Infocyph\Epicrypt\Auth\OAuth\OAuthRevocationEndpoint,Infocyph\Epicrypt\Auth\OAuth\OAuthIntrospectionEndpoint'
          - shard: oauth-client-auth
            classes: 'Infocyph\Epicrypt\Auth\OAuth\OAuthClientAuthenticator,Infocyph\Epicrypt\Auth\OAuth\OAuthClientAssertionValidator,Infocyph\Epicrypt\Auth\OAuth\OAuthClientKeySet,Infocyph\Epicrypt\Auth\OAuth\OAuthClientSecret'
          - shard: oidc-provider
            classes: 'Infocyph\Epicrypt\Auth\Oidc\OpenIdAuthorizationRequestValidator,Infocyph\Epicrypt\Auth\Oidc\OpenIdInteractionPolicy,Infocyph\Epicrypt\Auth\Oidc\OpenIdIdTokenIssuer,Infocyph\Epicrypt\Auth\Oidc\OpenIdTokenResponseExtension,Infocyph\Epicrypt\Auth\Oidc\OpenIdUserInfoProjector,Infocyph\Epicrypt\Auth\Oidc\OpenIdProviderMetadata'
          - shard: personal-access-token
            classes: 'Infocyph\Epicrypt\Auth\Personal\PersonalAccessTokenManager,Infocyph\Epicrypt\Auth\Personal\PersonalAccessTokenPolicy,Infocyph\Epicrypt\Auth\Personal\PersonalAccessTokenAbilities,Infocyph\Epicrypt\Auth\Personal\PersonalAccessTokenWildcardPolicy'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: pcov
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Restore mutation-generation cache
        uses: actions/cache@v5
        with:
          path: vendor/pestphp/pest-plugin-mutate/.temp
          key: "pest-mutate-${{ runner.os }}-php84-${{ matrix.shard }}-${{ hashFiles('composer.json', 'composer.lock', 'src/**/*.php') }}"
          restore-keys: |
            pest-mutate-${{ runner.os }}-php84-${{ matrix.shard }}-
      - name: Resolve the PHPForge Pest template outside the project root
        run: |
          sed \
            -e "s#vendor/phpunit/phpunit/phpunit.xsd#$GITHUB_WORKSPACE/vendor/phpunit/phpunit/phpunit.xsd#" \
            -e "s#bootstrap=\"vendor/autoload.php\"#bootstrap=\"$GITHUB_WORKSPACE/vendor/autoload.php\"#" \
            -e "s#<directory>./tests</directory>#<directory>$GITHUB_WORKSPACE/tests</directory>#" \
            -e "s#<directory suffix=\".php\">./src</directory>#<directory suffix=\".php\">$GITHUB_WORKSPACE/src</directory>#" \
            vendor/infocyph/phpforge/resources/pest.xml > "$RUNNER_TEMP/pest-mutation.xml"
      - name: Enforce the measured mutation-score floor
        run: >-
          vendor/bin/pest --configuration="${{ runner.temp }}/pest-mutation.xml" --cache-directory="${{ runner.temp }}/pest-cache" --mutate --parallel --processes=4 --min=66
          --class="${{ matrix.classes }}"
