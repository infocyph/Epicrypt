name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_versions: '["8.4","8.5"]'
      dependency_versions: '["prefer-lowest","prefer-stable"]'
      php_extensions: "hash, json, mbstring, openssl, sodium"
      composer_flags: ""
      phpstan_memory_limit: "1G"
      psalm_threads: "1"
      run_analysis: true
      run_svg_report: true
      fail_on_skipped_tests: true
      run_clean_install: true
      benchmark_composer_script: ""
      benchmark_result_file: ""
      benchmark_baseline_file: ""
      benchmark_max_regression_percent: 2
      benchmark_stable_environment: false
      enable_redis_service: false
      enable_valkey_service: false
      enable_memcached_service: false
      enable_postgres_service: false
      enable_mysql_service: false
      enable_scylladb_service: false
      enable_elasticsearch_service: false
      enable_mongodb_service: false
      service_db_name: "phpforge"
      service_db_user: "phpforge"
      service_db_password: "phpforge"
      artifact_retention_days: 61

  jose-interoperability:
    name: "Independent JOSE interoperability"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install and audit the independent JOSE implementation
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Verify bidirectional JOSE interoperability
        run: |
          php tests/Interop/epicrypt.php produce "${{ runner.temp }}/epicrypt-jose.json"
          node tests/Interop/jose.mjs "${{ runner.temp }}/epicrypt-jose.json" "${{ runner.temp }}/independent-jose.json"
          php tests/Interop/epicrypt.php consume "${{ runner.temp }}/epicrypt-jose.json" "${{ runner.temp }}/independent-jose.json"

  aegis-modern-libsodium:
    name: "AEGIS on libsodium 1.0.22"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AEGIS_RUNTIME: "php:8.4-cli-alpine@sha256:26e3f1de7f6aa3e8ea15584d803c5e088c57df89ff02a3ecf2dc855a4282d8d7"
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Require the modern linked runtime
        run: |
          docker pull "$AEGIS_RUNTIME"
          docker run --rm "$AEGIS_RUNTIME" php --ri sodium
          docker run --rm "$AEGIS_RUNTIME" php -r 'printf("PHP=%s libsodium=%s sodium=%s AEGIS-128L=%s AEGIS-256=%s\n", PHP_VERSION, SODIUM_LIBRARY_VERSION, extension_loaded("sodium") ? "loaded" : "missing", function_exists("sodium_crypto_aead_aegis128l_encrypt") ? "yes" : "no", function_exists("sodium_crypto_aead_aegis256_encrypt") ? "yes" : "no");'
          docker run --rm "$AEGIS_RUNTIME" php -r 'exit(version_compare(SODIUM_LIBRARY_VERSION, "1.0.19", ">=") && function_exists("sodium_crypto_aead_aegis128l_encrypt") && function_exists("sodium_crypto_aead_aegis256_encrypt") ? 0 : 1);'
      - name: Run mandatory positive AEGIS tests
        run: >-
          docker run --rm
          --workdir /workspace
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --env EPICRYPT_REQUIRE_AEGIS=1
          "$AEGIS_RUNTIME"
          php vendor/bin/pest
          --configuration vendor/infocyph/phpforge/resources/pest.xml
          --bootstrap /workspace/vendor/autoload.php
          --cache-directory=/tmp/pest-cache
          tests/Certificate/SodiumAdvancedTest.php
          --filter=AEGIS
          --fail-on-skipped

  mutation-security-critical:
    name: "Security-critical mutation testing (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: data-protection
            classes: 'Infocyph\Epicrypt\Crypto\AeadCipher,Infocyph\Epicrypt\DataProtection\StringProtector,Infocyph\Epicrypt\DataProtection\EnvelopeProtector,Infocyph\Epicrypt\DataProtection\FileProtector'
          - shard: jwe
            classes: 'Infocyph\Epicrypt\Token\Jwt\Jwe'
          - shard: jws
            classes: 'Infocyph\Epicrypt\Token\Jwt\Jws'
          - shard: validation-policy
            classes: 'Infocyph\Epicrypt\Password\PasswordHasher,Infocyph\Epicrypt\Token\Jwt\JwtValidator,Infocyph\Epicrypt\Security\KeyRing'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: pcov
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Apply the pinned PHPUnit 14 coverage compatibility patch
        run: |
          test "$(composer show pestphp/pest-plugin-mutate --format=json | jq --raw-output '.versions[0]')" = "v5.0.1"
          patch --batch --forward --strip=1 --directory=vendor/pestphp/pest-plugin-mutate < .github/patches/pest-mutate-phpunit14.diff
      - name: Restore mutation-generation cache
        uses: actions/cache@v5
        with:
          path: vendor/pestphp/pest-plugin-mutate/.temp
          key: "pest-mutate-${{ runner.os }}-php84-${{ matrix.shard }}-${{ hashFiles('composer.lock', '.github/patches/pest-mutate-phpunit14.diff', 'src/**/*.php') }}"
          restore-keys: |
            pest-mutate-${{ runner.os }}-php84-${{ matrix.shard }}-
      - name: Materialize the PHPForge Pest template for mutation workers
        run: cp vendor/infocyph/phpforge/resources/pest.xml pest.xml
      - name: Enforce the measured mutation-score floor
        run: >-
          vendor/bin/pest --configuration pest.xml --cache-directory="${{ runner.temp }}/pest-cache" --mutate --parallel --processes=4 --min=66
          --class="${{ matrix.classes }}"
