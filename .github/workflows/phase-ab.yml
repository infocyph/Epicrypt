name: "Epicrypt 3 Phase A+B Gates"

on:
  pull_request:
    branches: [ "main" ]

jobs:
  core-no-pathwise:
    name: "Core production install without Pathwise"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install production dependencies only
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist
      - name: Prove Pathwise is absent from the production graph
        run: |
          if composer show infocyph/pathwise --no-interaction >/dev/null 2>&1; then
            echo "Pathwise unexpectedly exists in the production dependency graph." >&2
            exit 1
          fi
          if grep -R --line-number --include='*.php' 'Infocyph\\Pathwise' src; then
            echo "Production source still imports Pathwise." >&2
            exit 1
          fi
          php tests/Smoke/core-no-pathwise.php

  pathwise4-stream-interop:
    name: "Pathwise 4 explicit-context stream interoperability"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prove Pathwise 4 is the dev-only integration target
        run: |
          composer show infocyph/pathwise
          php -r 'require "vendor/autoload.php"; $r = new ReflectionClass(Infocyph\Pathwise\Storage\StorageContext::class); echo $r->getName(), PHP_EOL;'
      - name: Resolve the PHPForge Pest template outside the dependency tree
        run: |
          sed \
            -e "s#vendor/phpunit/phpunit/phpunit.xsd#$GITHUB_WORKSPACE/vendor/phpunit/phpunit/phpunit.xsd#" \
            -e "s#bootstrap=\"vendor/autoload.php\"#bootstrap=\"$GITHUB_WORKSPACE/vendor/autoload.php\"#" \
            -e "s#<directory>./tests</directory>#<directory>$GITHUB_WORKSPACE/tests</directory>#" \
            -e "s#<directory suffix=\".php\">./src</directory>#<directory suffix=\".php\">$GITHUB_WORKSPACE/src</directory>#" \
            vendor/infocyph/phpforge/resources/pest.xml > "$RUNNER_TEMP/pest-phase-ab.xml"
      - name: Run stream and Pathwise isolation tests
        run: >-
          vendor/bin/pest
          --configuration="${{ runner.temp }}/pest-phase-ab.xml"
          --cache-directory="${{ runner.temp }}/pest-cache"
          tests/Architecture/DependencyBoundaryTest.php
          tests/DataProtection/FileStreamProtectionTest.php
          tests/Integrity/FileHasherStreamTest.php
          tests/Integration/Pathwise4StreamInteropTest.php
          --fail-on-skipped

  foundation-ecosystem-composition:
    name: "Foundation + Epicrypt 3 + OTP 6.1 + Pathwise 4 / PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.4", "8.5" ]
    steps:
      - name: Checkout Epicrypt 3 candidate
        uses: actions/checkout@v7
      - name: Checkout Foundation integration branch
        uses: actions/checkout@v7
        with:
          repository: infocyph/Foundation
          ref: foundation-3/close-26.6
          path: _foundation
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "hash, json, openssl, sodium, fileinfo"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Point the local Foundation graph at Epicrypt 3
        run: |
          php -r '
          $path = "_foundation/composer.json";
          $composer = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $composer["require-dev"]["infocyph/epicrypt"] = "^3.0";
          $repository = [
              "type" => "path",
              "url" => "..",
              "options" => [
                  "symlink" => false,
                  "versions" => ["infocyph/epicrypt" => "3.0.0"],
              ],
          ];
          $composer["repositories"] = array_merge([$repository], $composer["repositories"] ?? []);
          file_put_contents(
              $path,
              json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR).PHP_EOL,
          );
          '
      - name: Resolve the real Foundation development graph
        working-directory: _foundation
        run: |
          composer validate --strict
          composer update --no-interaction --no-progress --prefer-dist
      - name: Prove the selected ecosystem versions
        working-directory: _foundation
        run: |
          composer show infocyph/epicrypt
          composer show infocyph/otp
          composer show infocyph/pathwise
          composer why infocyph/epicrypt
          composer why infocyph/pathwise
          php -r '
          require "vendor/autoload.php";
          $versions = Composer\InstalledVersions::getPrettyVersion(...);
          foreach (["infocyph/epicrypt", "infocyph/otp", "infocyph/pathwise"] as $package) {
              printf("%s=%s\n", $package, Composer\InstalledVersions::getPrettyVersion($package) ?? "unknown");
          }
          '
      - name: Reject the legacy Pathwise 3 edge
        working-directory: _foundation
        run: |
          pathwise_version="$(composer show infocyph/pathwise --format=json | php -r '$d=json_decode(stream_get_contents(STDIN), true); echo $d["versions"][0] ?? "";')"
          case "$pathwise_version" in
            4.*|v4.*) ;;
            *) echo "Foundation did not resolve Pathwise 4: $pathwise_version" >&2; exit 1 ;;
          esac

  phase-ab-benchmark:
    name: "Epicrypt 2.1 baseline vs Phase A+B"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "hash, json, openssl, sodium"
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install Phase A+B dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Checkout frozen Epicrypt 2.1 baseline
        uses: actions/checkout@v7
        with:
          ref: f80092978328cccaef0d2233b08ce95b453dd90a
          path: _baseline
      - name: Install baseline dependencies
        working-directory: _baseline
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Capture comparable baseline and Phase A+B measurements
        run: |
          php benchmarks/phase-ab-benchmark.php "$GITHUB_WORKSPACE/_baseline/vendor/autoload.php" "epicrypt-2.1-main-f800929" | tee "$RUNNER_TEMP/epicrypt-2.1-main-f800929.json"
          php benchmarks/phase-ab-benchmark.php "$GITHUB_WORKSPACE/vendor/autoload.php" "epicrypt-3-phase-ab" | tee "$RUNNER_TEMP/epicrypt-3-phase-ab.json"
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v6
        with:
          name: epicrypt-phase-ab-benchmarks
          path: |
            ${{ runner.temp }}/epicrypt-2.1-main-f800929.json
            ${{ runner.temp }}/epicrypt-3-phase-ab.json
          if-no-files-found: error
